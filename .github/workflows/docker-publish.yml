# =============================================================================
# DataPilot – Build & Publish Docker Images to GitHub Container Registry (GHCR)
# =============================================================================
#
# This workflow builds all 7 DataPilot service images and, for a release,
# pushes them to ghcr.io/bringup-labs/datapilot-<service>. The packaged
# desktop app (dockerOrchestrator.ts) downloads the images tagged with its
# version, so end-users never have to build from source locally.
#
# Triggers:
#   • push to main, pull request  →  build only, to check the images build
#   • release pipeline (push_images: true)  →  push :<version> + :sha-<commit>
#
# :latest is never pushed. In development, `pnpm dev` builds any missing image
# from the checkout using docker-compose.override.yml.
#
# Images are multi-platform (linux/amd64 + linux/arm64).

name: Docker Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 'The git ref to checkout'
        required: false
        type: string
      push_images:
        description: 'Push images to registry after build'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/datapilot

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Core services ──────────────────────────────────────────────
          - service: backend
            image_suffix: backend
            dockerfile: backend/Dockerfile
            context: ./backend

          - service: mcap-parser
            image_suffix: mcap-parser
            dockerfile: mcap_parser/Dockerfile
            context: .

          # ── MCP workers (all use repo root as build context) ───────────
          - service: rosbag-reader
            image_suffix: mcp-rosbag-reader
            dockerfile: mcp_workers/rosbag_reader/Dockerfile
            context: .

          - service: trajectory-analyzer
            image_suffix: mcp-trajectory-analyzer
            dockerfile: mcp_workers/trajectory_analyzer/Dockerfile
            context: .

          - service: planner-failure-inspector
            image_suffix: mcp-planner-failure-inspector
            dockerfile: mcp_workers/planner_failure_inspector/Dockerfile
            context: .

          - service: anomaly-detector
            image_suffix: mcp-anomaly-detector
            dockerfile: mcp_workers/anomaly_detector/Dockerfile
            context: .

          - service: report-composer
            image_suffix: mcp-report-composer
            dockerfile: mcp_workers/report_composer/Dockerfile
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      # QEMU is required for cross-platform (arm64) builds on GitHub's amd64 runners.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: inputs.push_images || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # docker/metadata-action generates OCI-compliant image tags and labels.
      # Tags images with the package.json version and commit SHA, avoiding :latest.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image_suffix }}
          tags: |
            type=raw,value=${{ steps.get_version.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push image — ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push_images || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The desktop app downloads images without signing in, so a pushed image
      # that isn't public breaks every install. GHCR creates new packages as
      # private, so the first release under a new owner stops here, before the
      # release is created, until each package is made public.
      - name: Check ${{ matrix.service }} can be downloaded without signing in
        if: inputs.push_images || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image_suffix }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          repo="${IMAGE#ghcr.io/}"
          token=$(curl -fs "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty' || true)
          http_code=$(curl -s -o /dev/null -w '%{http_code}' --head \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${repo}/manifests/${VERSION}")
          if [ "${http_code}" != "200" ]; then
            echo "::error title=${IMAGE} is not public::Downloading ${IMAGE}:${VERSION} without signing in returned HTTP ${http_code}. On GitHub, open the ${repo#*/} package, then Package settings, and change its visibility to Public. Then re-run this job."
            exit 1
          fi
          echo "${IMAGE}:${VERSION} can be downloaded without signing in."
